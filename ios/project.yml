# XcodeGen spec: `xcodegen generate` writes StackChan.xcodeproj (not checked in).
name: StackChan
options:
  bundleIdPrefix: one.kbn.stackchan
  deploymentTarget:
    iOS: "26.0"
packages:
  StackChanKit:
    path: StackChanKit
targets:
  StackChan:
    type: application
    platform: iOS
    sources: [StackChan]
    dependencies:
      - package: StackChanKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.kbn.stackchan.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: スタックちゃんと Wi-Fi で直接つながるために使います。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: スタックちゃんに話しかけた声を文字にするために使います。
    info:
      path: StackChan/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
