; StackChan (SKU: K151, CoreS3) firmware.
; Arduino core 3.x (ESP-IDF 5) via pioarduino, which StackChan-BSP requires.
[env:stackchan]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
; Libraries are pinned. Most come from GitHub tags; the ones other libraries require by
; owner/name (M5Unit-NFC -> m5stack/M5UnitUnified, ESPAsyncWebServer -> ESP32Async/AsyncTCP) come
; from the PlatformIO registry under that name, so that the requirement is met by the same copy.
; StackChan-BSP is pinned to a commit after 1.1.0: 1.1.0 does not build against M5Unified 0.2.2x.
lib_deps =
  https://github.com/m5stack/M5Unified.git#0.2.26
  https://github.com/m5stack/M5GFX.git#0.2.33
  https://github.com/m5stack/StackChan-BSP.git#8d4d6fc3b7a6be379c6317c45a02a30bff8c492e
  https://github.com/crankyoldgit/IRremoteESP8266.git#v2.9.0
  https://github.com/m5stack/M5Unit-NFC.git#0.1.2
  m5stack/M5UnitUnified@0.6.0
  m5stack/M5Utility@0.3.1
  m5stack/M5HAL@0.1.4
  https://github.com/stack-chan/m5stack-avatar.git#v0.10.0
  https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.12.1
  esp32async/AsyncTCP@3.5.0
  https://github.com/bblanchon/ArduinoJson.git#v7.4.3
