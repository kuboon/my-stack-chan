name: ios

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version
      - name: StackChanKit tests
        run: swift test --package-path ios/StackChanKit
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Build the app for the simulator
        working-directory: ios
        run: >
          xcodebuild build -project StackChan.xcodeproj -scheme StackChan
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
